[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-code"
version = "0.1.0"
description = "A tiny terminal coding chat for local Ollama models"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "ollama",
    "questionary",
    "rich",
    "tiktoken",
    "prompt_toolkit",
]

[project.scripts]
pocket-code = "pocket_code:main"

[tool.setuptools]
py-modules = ["pocket_code"]
